<!--doubleclick-->

<script>
    const target=document.querySelector("#target");
    target.addEventListener("dbclick",()=> {
        target.textContent="You double clicked the box!" ;
        target.style.backgroundcolor="#bbf7d0";
    });
</script>

<!--mouseover mouseout-->


<script>
    const target=document.querySelector("#target");
    const result=document.querySelector("#result");

    target.addEventListener("mouseover",()=>{
        target.style.backgroundColor="#fed7aa";
        result.textContent="mouseover fired";
    });

    target.addEventListener("mouseout",()=>{
        target.style.backgroundColor="#dbeafe";
        result.textContent="mouseout fired";
    });
</script>

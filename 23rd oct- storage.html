<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Products</title>
</head>
<body>
    <button id="loadBtn">Load Users</button>
    <p id="status"></p>

    <table border="1">
        <thead>
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Brand</th>
            </tr>
        </thead>
        <tbody id="userTable"></tbody>
    </table>

    <script>
        const loadBtn = document.getElementById("loadBtn");
        const userTable = document.getElementById("userTable");
        const status = document.getElementById("status");

        function displayUsers(users) {
            userTable.innerHTML = "";
            users.forEach((user) => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${user.title}</td>
                    <td>${user.category}</td>
                    <td>${user.price}</td>
                    <td>${user.brand ?? "N/A"}</td>
                `;

                userTable.appendChild(row);
            });
        }

        async function fetchUsers() {
            status.textContent = "Loading products...";
            loadBtn.disabled = true;
            userTable.innerHTML = "";

            try {
                const response = await fetch(
                    "https://dummyjson.com/products"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch products");
                }

                const data = await response.json();
                console.log(data.products);

                data.products.forEach((user) => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${user.title}</td>
                        <td>${user.category}</td>
                        <td>${user.price}</td>
                        <td>${user.brand ?? "N/A"}</td>
                    `;

                    userTable.appendChild(row);
                });


                //store API data in local storage
                localStorage.setItem("users", JSON.stringify(data.products));

                fetchUsers(data.products);

                status.textContent = "Products loaded successfully!";
            } catch (error) {
                status.textContent = "Error: " + error.message;
            } finally {
                loadBtn.disabled = false;
            }

            function loadSavedUsers(){
                const savedUsers = localStorage.getItem("users");
                if (savedUsers) {
                    fetchUsers(JSON.parse(savedUsers));
                    status.textContent = "Loaded users from local storage.";
                }else {
                    status.textContent = "Click Load Users to fetch data";
                }
            }
        }


        loadBtn.addEventListener("click", fetchUsers);

        status.textContent="Users loaded successfully!";
    
    </script>
</body>
</html>
